name: ci
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK pieces
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tekken6-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: cd server && node --test tests/*.test.ts
      - name: Native tests
        run: sh scripts/test-native.sh
